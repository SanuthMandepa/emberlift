name: Guard

# Enforces the two conventions in specs/constitution.md that are easy to state and
# easy to violate by accident:
#   Article VIII.1  no em dashes anywhere
#   Article X       no AI is ever credited as a contributor
#
# Three notes on how this is written. All three are things that broke in development
# and are recorded so nobody has to rediscover them.
#
# 1. The patterns are built so this file does not match itself. The em dash is matched
#    by its PCRE codepoint escape rather than typed literally, and the HTML entity
#    forms use a one character class so the pattern text differs from the text it
#    detects. Use \x{2014}, not \xe2\x80\x94: in a UTF-8 locale PCRE reads \xNN as a
#    character, not a raw byte, so the byte form silently matches nothing.
#
# 2. grep returns 0 for a match, 1 for no match, and 2 or higher for an error such as
#    a locale it cannot handle. Exit codes are therefore checked explicitly, and an
#    error fails the build rather than being treated as a clean result. A guard that
#    fails open is worse than no guard.
#
# 3. GitHub Actions runs each `run:` block as `bash -e`, so a bare grep that exits 1,
#    which is the CLEAN case here, aborts the step before its exit code can be read.
#    Every grep below is therefore written as `|| status=$?`, which marks it as a
#    tested command and stops -e from killing the step.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LC_ALL: C.UTF-8

jobs:
  conventions:
    name: Repository conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self test, the guard must actually detect a violation
        run: |
          printf 'a \xe2\x80\x94 b\n' > /tmp/guard-selftest.txt
          status=0
          grep -qP '\x{2014}|&m[d]ash;|&#821[2];' /tmp/guard-selftest.txt || status=$?
          rm -f /tmp/guard-selftest.txt
          if [ "$status" -ne 0 ]; then
            echo "::error::The em dash pattern failed to match a known em dash. The guard is broken and would pass anything. Fix the pattern before trusting any result below."
            exit 1
          fi
          echo "Self test passed: the pattern detects a known violation."

      - name: No em dashes in tracked files
        run: |
          status=0
          grep -rnP \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            '\x{2014}|&m[d]ash;|&#821[2];' . || status=$?
          case "$status" in
            0) echo "::error::Em dash found. Constitution Article VIII.1 forbids em dashes. Use a comma, a colon, a period, or parentheses."; exit 1 ;;
            1) echo "Clean: no em dashes in tracked files." ;;
            *) echo "::error::grep exited with status $status, so this check did not run. Failing rather than passing on an unverified result."; exit 1 ;;
          esac

      - name: No em dashes in commit messages
        run: |
          status=0
          git log --format='%s%n%b' | grep -nP '\x{2014}' || status=$?
          case "$status" in
            0) echo "::error::Em dash found in a commit message. Constitution Article VIII.1."; exit 1 ;;
            1) echo "Clean: no em dashes in commit messages." ;;
            *) echo "::error::grep exited with status $status, so this check did not run."; exit 1 ;;
          esac

      - name: No AI attribution in commit history
        run: |
          status=0
          git log --format='%an%n%ae%n%cn%n%ce%n%s%n%b' \
            | grep -inE 'co-authored-by:.*(claude|anthropic|copilot|gpt|gemini|\[bot\])|generated with.*(claude|copilot|codex)|ai-(assisted|generated)' || status=$?
          case "$status" in
            0) echo "::error::AI attribution found in the commit history. Constitution Article X forbids crediting an assistant as author, co-author or committer."; exit 1 ;;
            1) echo "Clean: no AI attribution in commit history." ;;
            *) echo "::error::grep exited with status $status, so this check did not run."; exit 1 ;;
          esac

      - name: No AI attribution in tracked files
        run: |
          status=0
          grep -rniE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude=guard.yml \
            'co-authored-by:.*(claude|anthropic|copilot)|generated with \[?claude' . || status=$?
          case "$status" in
            0) echo "::error::AI attribution found in a tracked file. Constitution Article X."; exit 1 ;;
            1) echo "Clean: no AI attribution in tracked files." ;;
            *) echo "::error::grep exited with status $status, so this check did not run."; exit 1 ;;
          esac
